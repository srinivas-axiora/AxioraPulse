name: Deploy AWS Infrastructure & App (PROD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'AxioraPulse/infra/cdk/package-lock.json'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Dependencies
        run: npm ci
        working-directory: AxioraPulse/infra/cdk

      - name: Compile CDK
        run: npm run build
        working-directory: AxioraPulse/infra/cdk

      - name: Bootstrap CDK
        run: npx cdk bootstrap aws://039971552199/us-east-1
        working-directory: AxioraPulse/infra/cdk

      - name: Deploy CDK Stack
        run: npx cdk deploy --require-approval never
        working-directory: AxioraPulse/infra/cdk
